[project]
name = "course-qa"
version = "0.1.0"
description = "RAG question-answering assistant over university Course Material, with cited answers."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "faiss-cpu>=1.9",
    "fastapi>=0.115",
    "groq>=1.7.0",
    "httpx>=0.27",
    "numpy>=2.0",
    "pydantic>=2.9",
    "pymupdf>=1.25",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0",
    "requests>=2.32",
    "streamlit>=1.40",
    "uvicorn>=0.32",
]

[project.scripts]
course-qa = "course_qa.cli:main"

[project.optional-dependencies]
models = ["sentence-transformers>=3.3"]

[dependency-groups]
dev = ["pytest>=8.3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_qa"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uses real models; excluded by default (run with -m slow)"]
addopts = "-m 'not slow'"
